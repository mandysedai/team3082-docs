// Gradle init script: builds javadoc without editing the robot project.
// Turns off doclint (comment errors). Output goes to -DjavadocOut=<folder>.
allprojects {
    tasks.withType(Javadoc).configureEach {
        destinationDir = file(System.getProperty('javadocOut') ?: 'build/docs/javadoc')
        failOnError = false
        options.addStringOption('Xdoclint:none', '-quiet')
        options.windowTitle = '2026Rebuilt API'
        options.docTitle = '2026Rebuilt (Team 3082) API'
        options.links('https://docs.oracle.com/en/java/javase/17/docs/api/',
                      'https://github.wpilib.org/allwpilib/docs/release/java/')
    }
}
